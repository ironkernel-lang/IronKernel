name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"

      - name: Restore
        run: dotnet restore IronKernel.sln

      - name: Verify generated CLR bindings
        run: |
          dotnet fsi tools/generate-clr-bindings.fsx manifests/safe-clr-bindings.json /tmp/Bindings.Safe.fs
          diff --strip-trailing-cr IronKernel.Runtime/Generated/Bindings.Safe.fs /tmp/Bindings.Safe.fs

      - name: Build
        run: dotnet build IronKernel.sln -c Release --no-restore

      - name: Test
        run: dotnet test IronKernel.sln -c Release --no-build --verbosity normal

      # The library pair a host references (see the release workflow). The
      # exe project packs as a library only with this property, and the
      # bundled line editor is what a release without it would silently lose.
      - name: Pack the library packages
        run: |
          set -euo pipefail
          dotnet pack IronKernel.Runtime/IronKernel.Runtime.fsproj -c Release --no-build -o /tmp/packages
          dotnet pack IronKernel/IronKernel.fsproj -c Release --no-build -o /tmp/packages -p:IronKernelPackage=library
          version="$(tr -d '[:space:]' < version)"
          test "$(unzip -l "/tmp/packages/IronKernel.$version.nupkg" | grep -cE 'lib/net10.0/Mono.Terminal.dll|contentFiles/any/net10.0/kernel.ikr|contentFiles/any/net10.0/promises.ikr')" -eq 3

      - name: Test first-party packages (lib/)
        run: |
          bin="$PWD/IronKernel/bin/Release/net10.0/IronKernel"
          # Seed the local folder feeds siblings restore from (lib/NuGet.config).
          "$bin" pack lib/IronKernel.Test/IronKernel.Test.ikproj
          "$bin" pack lib/IronKernel.Strings/IronKernel.Strings.ikproj
          "$bin" pack lib/IronKernel.Collections/IronKernel.Collections.ikproj
          for project in lib/*/*.ikproj; do
            echo "=== ik test $project"
            "$bin" test "$project"
          done
