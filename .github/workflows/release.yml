name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Verify version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match root version file
        id: check
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::version file is '$FILE_VERSION' but tag is 'v$TAG_VERSION'. Bump version, commit, then tag v\$FILE_VERSION."
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing IronKernel $FILE_VERSION"

  test:
    name: Test (linux)
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"
      - run: dotnet test IronKernel.sln -c Release --verbosity normal

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: IronKernel
          - os: blacksmith-4vcpu-windows-2025
            rid: win-x64
            exe: IronKernel.exe
          - os: macos-latest
            rid: osx-arm64
            exe: IronKernel
          - os: blacksmith-6vcpu-macos-latest
            rid: osx-x64
            exe: IronKernel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"

      - name: Publish single-file binary
        run: >
          dotnet publish IronKernel/IronKernel.fsproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/ironkernel-${{ matrix.rid }}"
          mkdir -p "$STAGE"
          cp "publish/${{ matrix.rid }}/${{ matrix.exe }}" "$STAGE/"
          cp IronKernel/kernel.ikr IronKernel/promises.ikr "$STAGE/"
          cp README.md COPYING "$STAGE/"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$STAGE/${{ matrix.exe }}"
          fi
          tar -C dist -czf "dist/ironkernel-${{ matrix.rid }}.tar.gz" "ironkernel-${{ matrix.rid }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironkernel-${{ matrix.rid }}
          path: dist/ironkernel-${{ matrix.rid }}.tar.gz

  packages:
    name: Pack project tooling
    needs: [version, test]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"
      - run: >
          dotnet pack IronKernel/IronKernel.fsproj
          -c Release
          -o packages
          -p:Version=${{ needs.version.outputs.version }}
      - run: >
          dotnet pack sdk/IronKernel.Sdk/IronKernel.Sdk.csproj
          -c Release
          -o packages
          -p:Version=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ironkernel-nuget-packages
          path: packages/*.nupkg

  release:
    name: Create GitHub Release
    needs: [version, publish, packages]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -type f -name '*.nupkg' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: IronKernel ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
